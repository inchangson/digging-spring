name: sas-demo
services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: sas_demo
      POSTGRES_USER: sas_demo
      POSTGRES_PASSWORD: local-demo-only
    ports: ["127.0.0.1:55439:5432"]
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "track_io_timing=on", "-c", "max_connections=60"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sas_demo -d sas_demo"]
      interval: 2s
      retries: 30
